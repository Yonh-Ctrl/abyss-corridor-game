name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile check
        shell: pwsh
        run: python -m py_compile abyss_corridor.py

      - name: Build onedir package
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name AbyssCorridor --icon icon.ico --add-data "assets;assets" abyss_corridor.py
          Copy-Item LICENSE dist/AbyssCorridor/LICENSE.txt
          Copy-Item CHANGELOG.md dist/AbyssCorridor/RELEASE_NOTES.md

      - name: Package zip
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq "main") { $tag = "dev" }
          $zip = "AbyssCorridor-$tag-win64.zip"
          Compress-Archive -Path dist/AbyssCorridor/* -DestinationPath $zip -CompressionLevel Optimal
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-FileHash $zip -Algorithm SHA256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbyssCorridor-windows
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
