name: Bootstrap import and first release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[skip-import]') }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project bundle
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 -o bundle.zip "https://aka.doubaocdn.com/s/lx4bww5iRs"
          if (-not (Test-Path bundle.zip)) { throw "bundle download failed" }

      - name: Extract project bundle
        shell: pwsh
        run: |
          Expand-Archive -Path bundle.zip -DestinationPath . -Force
          Remove-Item bundle.zip -Force

      - name: Commit imported files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          $changes = git status --porcelain
          if ([string]::IsNullOrWhiteSpace($changes)) {
            Write-Output "No imported changes to commit"
          } else {
            git commit -m "chore: import Abyss Corridor v3.5.0 [skip-import]"
            git push
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile check
        shell: pwsh
        run: python -m py_compile abyss_corridor.py

      - name: Build onedir package
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name AbyssCorridor --icon icon.ico --add-data "assets;assets" abyss_corridor.py
          Copy-Item LICENSE dist/AbyssCorridor/LICENSE.txt
          Copy-Item CHANGELOG.md dist/AbyssCorridor/RELEASE_NOTES.md
          Compress-Archive -Path dist/AbyssCorridor/* -DestinationPath AbyssCorridor-v3.5.0-win64.zip -CompressionLevel Optimal

      - name: Prepare release body
        shell: pwsh
        run: |
          $hash = (Get-FileHash AbyssCorridor-v3.5.0-win64.zip -Algorithm SHA256).Hash
          $body = Get-Content CHANGELOG.md -Raw
          $body += "`n`n## Windows package`n`n- File: AbyssCorridor-v3.5.0-win64.zip`n- SHA256: ``$hash```n"
          $body | Out-File release_body.md -Encoding utf8
          Write-Output "SHA256=$hash"

      - name: Create v3.5.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.5.0
          name: Abyss Corridor v3.5.0
          body_path: release_body.md
          files: AbyssCorridor-v3.5.0-win64.zip
          draft: false
          prerelease: false
          make_latest: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbyssCorridor-v3.5.0-windows
          path: AbyssCorridor-v3.5.0-win64.zip
